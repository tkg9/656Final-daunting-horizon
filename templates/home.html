{% extends "base.html" %}
{% block content %}
  <h1>StageCraft</h1>
  <p>Theater production management from script to stage.</p>
  {% if user.is_authenticated %}
    <p>Signed in as {{ user.username }}. <a href="{% url 'production-list' %}">Go to your productions</a>.</p>
  {% else %}
    <p><a href="{% url 'login' %}">Log in</a> to manage your productions.</p>
  {% endif %}
{% endblock %}
