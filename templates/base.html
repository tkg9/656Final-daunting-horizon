<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StageCraft{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 820px; margin: 0 auto; padding: 1rem; line-height: 1.5; }
    nav { display: flex; gap: 1rem; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: .5rem; margin-bottom: 1rem; }
    nav form { margin-left: auto; }
    textarea, input[type=text] { width: 100%; box-sizing: border-box; font: inherit; }
    pre { white-space: pre-wrap; background: #f6f6f6; padding: .75rem; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'home' %}">StageCraft</a>
    {% if user.is_authenticated %}
      <a href="{% url 'production-list' %}">My productions</a>
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Log out</button></form>
    {% else %}
      <a href="{% url 'login' %}">Log in</a>
    {% endif %}
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
