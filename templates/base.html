{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}StageCraft{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'vendor/pico/pico.min.css' %}">
  <link rel="stylesheet" href="{% static 'stagecraft.css' %}">
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><a href="{% url 'home' %}"><strong>StageCraft</strong></a></li></ul>
      <ul>
        {% if user.is_authenticated %}
          <li><a href="{% url 'production-list' %}">Productions</a></li>
          <li>
            <form method="post" action="{% url 'logout' %}">
              {% csrf_token %}<button type="submit" class="secondary outline">Log out</button>
            </form>
          </li>
        {% else %}
          <li><a href="{% url 'login' %}">Log in</a></li>
          <li><a href="{% url 'signup' %}" role="button">Sign up</a></li>
        {% endif %}
      </ul>
    </nav>
  </header>
  <main class="container">
    {% for message in messages %}
      <article class="message {{ message.tags }}" role="status">{{ message }}</article>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
